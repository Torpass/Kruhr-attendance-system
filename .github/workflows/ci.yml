name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Las apps importan los tipos y el código compilado de packages/core.
      - run: pnpm --filter @marcaje/core build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @marcaje/api test:e2e
      - run: pnpm build
