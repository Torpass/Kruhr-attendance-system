name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres para los e2e de integración (aislamiento entre empresas, marcaje, período).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marcaje_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marcaje_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marcaje_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Las apps importan los tipos y el código compilado de packages/core.
      - run: pnpm --filter @marcaje/core build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @marcaje/api test:e2e
      - run: pnpm build
