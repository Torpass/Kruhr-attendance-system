# Supabase (plan gratuito) pausa el proyecto tras 7 días sin actividad.
# /api/health hace `select 1`, así que esto lo mantiene activo y de paso despierta Render.
name: Keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --max-time 90 "$HEALTH_URL"
