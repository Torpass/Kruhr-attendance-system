# Postgres local para desarrollo y tests. En producción se usa Supabase.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marcaje
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marcaje"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
